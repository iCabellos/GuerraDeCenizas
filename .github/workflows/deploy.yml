# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ Despliegue — la mitad del sistema que Vercel no toca                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# Vercel despliega la aplicación solo, por su integración con GitHub. Lo que nadie
# desplegaba era **la base de datos**: migraciones, ajustes de Auth y los secretos del
# reloj eran pasos manuales documentados en DEPLOYMENT.md, y un paso manual documentado es
# un paso que se hace una vez y se olvida en el proyecto siguiente.
#
# Lo caro de olvidarlos es que **no fallan ruidosamente**:
#
# · Sin migraciones, la aplicación compila y arranca; se cae al primer `select`.
# · Sin `site_url`, el enlace del correo lleva a `http://localhost:3000` — el fallo que
#   originó este workflow. Nada da error: Supabase sustituye el destino en silencio.
# · Sin los secretos del vault, `pg_cron` late, llama con un `Authorization` vacío, recibe
#   401 y las partidas con ausencias se quedan quietas para siempre.
#
# Los tres son ahora pasos de este archivo, y los tres se comprueban al final.

name: deploy

on:
  push:
    branches: [main]
    # La aplicación la despliega Vercel; aquí solo importa lo que toca la base de datos.
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Dos despliegues a la vez aplicarían migraciones sobre la misma base. Sin
# `cancel-in-progress`: cancelar a mitad de una migración es peor que esperar.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Entorno de GitHub: es donde viven los secretos, y donde se puede exigir una
    # aprobación manual antes de tocar producción si algún día hace falta.
    environment: production

    # Los valores llegan **en crudo**: se normalizan y se validan en el primer paso, y
    # las URL derivadas se componen allí. Componerlas aquí fue un error que costó un
    # despliegue entero — ver el comentario de ese paso.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GDC_CRON_SECRET: ${{ secrets.CRON_SECRET }}

      RAW_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RAW_SITE_URL: ${{ vars.GDC_SITE_URL }}
      RAW_PREVIEW_PATTERN: ${{ vars.GDC_PREVIEW_URL_PATTERN }}

    steps:
      - uses: actions/checkout@v4

      # Versión fija y no `latest`: un despliegue que cambia de herramienta sin que nadie
      # lo decida no es reproducible, y esto aplica migraciones a producción.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # ── Comprobación previa ──────────────────────────────────────────────────
      #
      # Comprueba que la configuración está **y que sirve**. La primera versión solo
      # miraba que no estuviera vacía, dijo «✓ configuración completa» y el despliegue
      # murió dos pasos después con `Invalid project ref format`, un mensaje del CLI que
      # no dice de dónde sale el valor malo.
      #
      # La causa era un salto de línea colado al pegar los valores en el panel de GitHub.
      # Es invisible en la caja de texto, invisible en la pantalla de variables, y en el
      # log aparece como una URL partida en dos. Un valor presente pero inservible es
      # peor que uno ausente: la comprobación lo bendice y el fallo aflora más adelante,
      # ya sin relación aparente con su causa.
      #
      # Por eso las URL derivadas se componen **aquí** y no en el bloque `env` del job:
      # allí se concatenaban antes de poder limpiarlas, y `SITE_URL\n` + `/auth/callback`
      # daba una dirección con un salto de línea en medio.
      - name: Comprobar y normalizar la configuración
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD GDC_CRON_SECRET \
                      RAW_PROJECT_REF RAW_SITE_URL RAW_PREVIEW_PATTERN; do
            [ -n "${!name}" ] || missing="$missing ${name#RAW_}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Falta configuración del despliegue:$missing"
            echo "Los secretos van en Settings → Environments → production → Secrets."
            echo "Las variables (vars.*) en la pestaña Variables del mismo entorno."
            exit 1
          fi

          # Recorta espacios y saltos en los extremos, sin subshell y sin tocar el interior.
          trim() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }

          PROJECT_REF=$(trim "$RAW_PROJECT_REF")
          SITE_URL=$(trim "$RAW_SITE_URL")
          SITE_URL="${SITE_URL%/}"                 # una barra final duplicaría la siguiente
          PREVIEW_PATTERN=$(trim "$RAW_PREVIEW_PATTERN")

          # Los secretos NO se recortan: reescribir un valor enmascarado lo desenmascara
          # en los logs. Se detectan y se avisa, sin imprimirlos nunca.
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD GDC_CRON_SECRET; do
            raw="${!name}"
            if [ "$raw" != "$(trim "$raw")" ]; then
              echo "::error::$name lleva un espacio o un salto de línea en los extremos."
              echo "Vuelve a pegarlo sin el salto final: el CLI lo considera parte del valor."
              exit 1
            fi
            # Y cualquier carácter fuera del ASCII imprimible. Un espacio duro (U+00A0) o
            # un espacio de ancho cero (U+200B) sobreviven al recorte de arriba —no son
            # `[[:space:]]`— y se cuelan al copiar de un panel web. Postgres los rechaza
            # con `password authentication failed`, que suena a contraseña equivocada y
            # manda a buscar donde no es. Nunca se imprime el valor, solo el veredicto.
            if printf '%s' "$raw" | LC_ALL=C grep -q '[^[:print:]]'; then
              echo "::error::$name contiene un carácter invisible o no ASCII."
              echo "Casi siempre es un espacio duro colado al copiar. Vuelve a escribirlo a mano,"
              echo "o regenéralo para que sea alfanumérico."
              exit 1
            fi
          done

          # La referencia del proyecto son 20 letras minúsculas. Comprobarlo aquí convierte
          # el `Invalid project ref format` del CLI en un error que dice dónde mirar.
          case "$PROJECT_REF" in
            *[!a-z]* | "" ) bad=1 ;;
            * ) [ ${#PROJECT_REF} -eq 20 ] && bad=0 || bad=1 ;;
          esac
          if [ "$bad" -eq 1 ]; then
            echo "::error::SUPABASE_PROJECT_REF no tiene forma de referencia de proyecto."
            echo "Son 20 letras minúsculas, sin https:// y sin .supabase.co."
            echo "Recibido: ${#PROJECT_REF} caracteres."
            exit 1
          fi

          case "$SITE_URL" in
            https://*) ;;
            *) echo "::error::GDC_SITE_URL debe empezar por https://. Recibido: $SITE_URL"; exit 1 ;;
          esac

          {
            echo "PROJECT_REF=$PROJECT_REF"
            echo "GDC_SITE_URL=$SITE_URL"
            echo "GDC_CALLBACK_URL=$SITE_URL/auth/callback"
            echo "GDC_RESOLVE_URL=$SITE_URL/api/cron/resolve-due"
            echo "GDC_PREVIEW_URL_PATTERN=$PREVIEW_PATTERN"
          } >> "$GITHUB_ENV"

          echo "✓ configuración completa y bien formada"
          echo "  proyecto : $PROJECT_REF"
          echo "  sitio    : $SITE_URL"
          echo "  callback : $SITE_URL/auth/callback"

      # ── Enlazar el proyecto ──────────────────────────────────────────────────
      #
      # `db push` funciona con solo `--project-ref`, pero `db query` no: intenta una
      # conexión directa a la base, que en Supabase es **IPv6**, y los runners de GitHub
      # son solo IPv4. El propio CLI lo dice y sugiere la solución:
      #
      #     IPv6 is not supported on your current network
      #     Run supabase link --project-ref … to setup IPv4 connection.
      #
      # `link` resuelve el pooler —que sí es IPv4— y lo deja escrito para el resto de
      # comandos. Va antes que todo lo demás para que ningún paso dependa de si el que
      # tiene delante enlazó o no.
      - name: Enlazar el proyecto
        run: supabase link --project-ref "$PROJECT_REF"

      # ── Migraciones ──────────────────────────────────────────────────────────
      # `--dry-run` primero: deja en el log exactamente qué se va a aplicar, que es la
      # única forma de reconstruir después qué cambió y cuándo.
      - name: Migraciones pendientes
        run: supabase db push --project-ref "$PROJECT_REF" --dry-run

      - name: Aplicar migraciones y secretos del vault
        run: supabase db push --project-ref "$PROJECT_REF"

      # ── Ajustes de Auth ──────────────────────────────────────────────────────
      # `site_url`, la lista blanca de redirecciones y las sesiones anónimas. Es la mitad
      # del arreglo del enlace a localhost que no vive en el código.
      - name: Empujar la configuración de Auth
        run: supabase config push --project-ref "$PROJECT_REF"

      # ── Comprobaciones ───────────────────────────────────────────────────────
      # Un despliegue que termina sin comprobar nada solo demuestra que los comandos no
      # dieron error. Estas tres preguntan por el resultado.

      - name: El reloj está programado
        run: |
          # `cmd | tee` esconde el estado de `cmd`: `bash -e` solo mira el del último de la
          # tubería, y `tee` siempre va bien. Sin esto, un fallo del CLI se tragaba y el
          # `grep` de abajo lo reportaba como «pg_cron no tiene programado gdc-resolve-due»
          # — una causa inventada, que es peor que no informar. Los tres pasos lo llevan.
          set -o pipefail
          supabase db query --linked "
            select jobname, schedule, active from cron.job
             where jobname = 'gdc-resolve-due';
          " | tee /tmp/cron.txt
          grep -q 'gdc-resolve-due' /tmp/cron.txt || {
            echo "::error::pg_cron no tiene programado gdc-resolve-due"; exit 1; }

      - name: El reloj tiene sus dos secretos
        run: |
          set -o pipefail
          supabase db query --linked "
            select name from vault.decrypted_secrets
             where name in ('gdc_resolve_url','gdc_cron_secret') order by name;
          " | tee /tmp/vault.txt
          for name in gdc_cron_secret gdc_resolve_url; do
            grep -q "$name" /tmp/vault.txt || {
              echo "::error::falta el secreto $name en el vault"; exit 1; }
          done

      # La comprobación que de verdad manda. `game_states` lleva RLS activa y **cero
      # políticas** a propósito (ADR-006): es ilegible por construcción, y ahí es donde
      # vive la niebla de guerra del juego entero. Una política añadida por descuido no
      # rompe ningún test de la aplicación — simplemente enseña a todo el mundo el estado
      # completo de la partida. Si esto falla, el despliegue se para.
      - name: game_states sigue siendo ilegible
        run: |
          set -o pipefail
          # El veredicto lo decide SQL y sale como una cadena, en vez de devolver las
          # cifras y decidir aquí. Así la comprobación no depende de cómo formatee el CLI
          # su salida: si el formato cambiara, no aparece GDC_OK y el paso falla — que es
          # el lado correcto por el que equivocarse cuando lo que se comprueba es esto.
          supabase db query --linked "
            select case
                     when c.relrowsecurity
                      and (select count(*) from pg_policy p where p.polrelid = c.oid) = 0
                     then 'GDC_OK_ilegible'
                     else 'GDC_FALLO_legible'
                   end as veredicto
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relname = 'game_states';
          " | tee /tmp/gs.txt
          if grep -q 'GDC_FALLO_legible' /tmp/gs.txt; then
            echo "::error::game_states tiene políticas RLS o la RLS desactivada."
            echo "::error::Es ilegible por construcción a propósito (ADR-006). Despliegue detenido."
            exit 1
          fi
          grep -q 'GDC_OK_ilegible' /tmp/gs.txt || {
            echo "::error::no se pudo comprobar game_states (¿existe la tabla?)"; exit 1; }
          echo "✓ game_states: RLS activa, cero políticas"

      - name: Resumen
        run: |
          {
            echo "### Supabase desplegado"
            echo
            echo "| Paso | Estado |"
            echo "|---|---|"
            echo "| Migraciones | aplicadas |"
            echo "| Auth (site_url, redirecciones, invitados) | empujado |"
            echo "| Secretos del reloj | en el vault |"
            echo "| \`game_states\` ilegible | verificado |"
            echo
            echo "Site URL: \`$GDC_SITE_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
